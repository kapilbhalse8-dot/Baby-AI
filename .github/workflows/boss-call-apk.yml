name: Build BOSS CALL APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'boss-call/**'
      - '.github/workflows/boss-call-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: boss-call
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOSS-CALL-debug-apk
          path: boss-call/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
